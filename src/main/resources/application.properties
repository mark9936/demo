# HTTP port
server.port=8080

# H2 記憶體資料庫。DB_CLOSE_DELAY=-1 讓應用程式執行期間資料保持存在。
spring.datasource.url=jdbc:h2:mem:schooldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 由 Hibernate 依照 @Entity 建立資料表；重啟應用程式時會重新建立。
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# REST API 不需要讓 EntityManager 延伸到 Web Response 階段。
spring.jpa.open-in-view=false
# 使用 @Column 寫出的欄位名稱，不額外轉成 snake_case，方便初學者對照 Entity 與 SQL。
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Hibernate 建表完成後再執行 data.sql，載入幾筆教學資料。
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# 開啟 H2 Console 後，可用 http://localhost:8080/h2-console 查看資料。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
